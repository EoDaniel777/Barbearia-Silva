services:
  # Backend API (Go)
  - type: web
    name: barbearia-silva-api
    runtime: go
    region: oregon
    plan: free
    rootDirectory: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app cmd/api/main.go
    startCommand: ./app
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_PATH
        value: ./cmd/api/data/barbearia.db
    healthCheckPath: /health
    autoDeploy: true

