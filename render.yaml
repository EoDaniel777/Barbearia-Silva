services:
  # Backend API (Go)
  - type: web
    name: barbearia-silva-api
    env: go
    buildCommand: go install golang.org/dl/go1.25.4@latest && ~/go/bin/go1.25.4 download && cd backend && ~/go/bin/go1.25.4 build -tags netgo -ldflags '-s -w' -o app cmd/api/main.go
    startCommand: cd backend && ./app
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_PATH
        value: ./cmd/api/data/barbearia.db
    healthCheckPath: /health

  # Static Site (Frontend) - Opcional, caso queira servir separadamente
