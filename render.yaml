services:
  # Backend API (Go)
  - type: web
    name: goNext-api
    env: go
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend/cmd/api && ./app
    envVars:
      # Servidor
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: DATABASE_PATH
        value: ./cmd/api/data/goNext.db

      # JWT Authentication
      - key: JWT_SECRET_KEY
        sync: false  # Configure via Render Dashboard (Secret)

      # Firebase (Opcional - Configure via Dashboard)
      - key: FIREBASE_PROJECT_ID
        value: goNext
    healthCheckPath: /health

  # Static Site (Frontend) - Opcional, caso queira servir separadamente
