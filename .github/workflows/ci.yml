name: CI - Build & Test

on:
  push:
    branches: [ master, prod, dev ]
  pull_request:
    branches: [ master, prod ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.25.4
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: |
          cd backend
          go mod download
          go mod verify

      - name: Run go vet
        run: |
          cd backend
          go vet ./...

      - name: Build application
        run: |
          cd backend
          go build -tags netgo -ldflags '-s -w' -o cmd/api/app cmd/api/main.go
          ls -lh cmd/api/app

      - name: Run tests
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        continue-on-error: true

      - name: Build success
        if: success()
        run: |
          echo "✅ Build concluído com sucesso!"
          echo "📦 Binário gerado em: backend/cmd/api/app"

      - name: Build failed
        if: failure()
        run: |
          echo "❌ Build falhou! Verifique os logs acima."
