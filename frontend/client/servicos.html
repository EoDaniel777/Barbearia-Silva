<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F0F0F">
    <title>Serviços - Barbearia Silva</title>
    <link rel="stylesheet" href="/css/mobile-modern.css">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Theme Manager -->
    <script src="/shared/js/theme-manager.js?v=4"></script>
    <!-- Auth Client -->
    <script defer src="/js/auth-client.js?v=2"></script>
</head>
<body>
    <!-- Modern Header -->
    <header>
        <div class="header-logo">
            <img src="/img/logoDark.jpeg" id="headerLogo" alt="Barbearia Silva">
        </div>

        <!-- Desktop Navigation -->
        <nav class="header-nav">
            <a href="/login" class="btn-login">Acessar</a>
            <a href="/">Início</a>
            <a href="/servicos">Serviços</a>
            <a href="/agendar">Agendar</a>
            <a href="/barbeiros">Equipe</a>
        </nav>

        <div class="header-actions">
            <label class="theme-toggle-label">
                <input class="theme-checkbox" type="checkbox" id="theme-toggle-checkbox" />
            </label>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <h1 class="hero-title">Nossos Serviços</h1>
        <p class="hero-subtitle">Qualidade e profissionalismo em cada atendimento</p>
    </section>

    <!-- Main Content -->
    <div class="content-wrapper">

        <!-- Services Section -->
        <section class="section">
            <div class="cards-container" id="services-container">
                <!-- Cards serão carregados dinamicamente do banco -->
                <div style="text-align: center; padding: 40px; color: #8E8E93;">
                    <p>Carregando serviços...</p>
                </div>
            </div>
        </section>

        <!-- CTA Section -->
        <section class="section">
            <a href="/agendar" class="btn-primary">Agendar Meu Horário</a>
        </section>

    </div>

    <!-- Footer -->
    <footer>
        <img src="/img/logoDark.jpeg" id="footerLogo" alt="Barbearia Silva" class="footer-logo">
        <div class="footer-info">
            <p>📞 <span id="footer-telefone">(61) 00000-0000</span></p>
            <p>📍 <span id="footer-endereco">Morro Azul - Quadra 11 Conjunto A</span></p>

            <!-- Redes Sociais (carregadas dinamicamente) -->
            <div class="social-media" style="margin: 21px 0 16px 0;"></div>

            <p style="margin-top: 20px; font-size: 12px;" id="footer-copyright">&copy; 2026 Barbearia Silva - Todos os direitos reservados</p>
        </div>
    </footer>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <img src="/icons/home.svg" alt="Início">
            <span>Início</span>
        </a>
        <a href="/servicos" class="nav-item active">
            <img src="/icons/servico.svg" alt="Serviços">
            <span>Serviços</span>
        </a>
        <a href="/agendar" class="nav-item">
            <img src="/icons/calendar2.svg" alt="Agendar">
            <span>Agendar</span>
        </a>
        <a href="/barbeiros" class="nav-item">
            <img src="/icons/person.svg" alt="Equipe">
            <span>Equipe</span>
        </a>
    </nav>

    <!-- Personalization Loader -->
    <script src="/shared/js/personalizacao-loader.js?v=2"></script>

    <script>
        // Theme Manager - Sistema Global de Tema (sem checkbox, só aplica)
        window.addEventListener('load', function() {
            if (window.ThemeManager && typeof window.ThemeManager.init === 'function') {
                window.ThemeManager.init({
                    checkboxId: 'theme-toggle-checkbox',
                    headerLogoId: 'headerLogo',
                    footerLogoId: 'footerLogo'
                });
                console.log('[SERVIÇOS] Theme Manager inicializado');
            } else {
                console.error('[PAGE] Theme Manager não encontrado');
            }
        });

        // Active nav item
        const currentPage = window.location.pathname;
        document.querySelectorAll('.nav-item').forEach(item => {
            if (item.getAttribute('href') === currentPage) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });

        // ===================================
        // CARREGAR SERVIÇOS DO BANCO
        // ===================================
        async function loadServicos() {
            console.log('[SERVIÇOS] Carregando serviços do banco...');

            const container = document.getElementById('services-container');
            if (!container) {
                console.error('[SERVIÇOS] Container não encontrado');
                return;
            }

            try {
                const response = await fetch('/api/v1/servicos');
                if (!response.ok) {
                    throw new Error('Erro ao carregar serviços');
                }

                const servicos = await response.json();
                console.log(`[SERVIÇOS] ${servicos.length} serviços carregados:`, servicos);

                // Filtrar apenas serviços ativos do tipo 'servico' (não produtos)
                const servicosAtivos = servicos.filter(s => s.ativo && s.tipo === 'servico');

                if (servicosAtivos.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: #8E8E93;">
                            <p>Nenhum serviço disponível no momento.</p>
                        </div>
                    `;
                    return;
                }

                // Renderizar cards
                container.innerHTML = servicosAtivos.map(servico => `
                    <div class="modern-card">
                        ${servico.foto ? `<img src="${servico.foto}" alt="${servico.nome}" class="card-image">` : ''}
                        <div class="card-content">
                            <h3 class="card-title">${servico.nome}</h3>
                            <p class="card-description">${servico.descricao || 'Serviço de qualidade profissional'}</p>
                            <div class="card-footer">
                                <span class="card-price">R$ ${servico.preco.toFixed(2).replace('.', ',')}</span>
                                ${servico.duracao > 0 ? `<span class="card-duration">⏱️ ${servico.duracao} min</span>` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');

                console.log('[SERVIÇOS] ✓ Cards renderizados');

            } catch (error) {
                console.error('[SERVIÇOS] Erro ao carregar:', error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #FF6B6B;">
                        <p>Erro ao carregar serviços. Tente novamente mais tarde.</p>
                    </div>
                `;
            }
        }

        // Carregar serviços quando página carregar
        // Aguardar um pouco para garantir que as cores personalizadas sejam aplicadas primeiro
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(loadServicos, 100);
            });
        } else {
            setTimeout(loadServicos, 100);
        }
    </script>
</body>
</html>
