<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0F0F0F">
    <title>Login - Barbearia Silva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        body.light-mode {
            background: #FFFFFF;
        }

        .login-container {
            background: #090a0c;
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 600px;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light-mode .login-container {
            background: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
        }

        .logo img {
            width: 150px;
            height: auto;
        }

        h1 {
            color: #FFFFFF;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 700;
        }

        body.light-mode h1 {
            color: #1C1C1E;
        }

        p {
            color: #8E8E93;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .alert.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.4);
            color: #4CAF50;
        }

        .alert.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.4);
            color: #F44336;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #FFFFFF;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        body.light-mode label {
            color: #1C1C1E;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        body.light-mode input {
            width: 500px;
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.1);
            color: #1C1C1E;
        }

        input:focus {
            outline: none;
            border-color: #0D7CA4;
            background: rgba(13, 124, 164, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        body.light-mode input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        .btn-login {
            width: 500px;
            margin-bottom: 20px;
            padding: 16px;
            background: #0D7CA4;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #0a6282;
            transform: translateY(-2px);
        }

        .btn-login:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            width: 500px;
            padding: 15px 0px;
            border-radius: 10px;
            margin: 20px 0px 10px 0px;
            background-color: #1C1C1E;
            color: #fff;
            border: 2px solid black;
            display: flex;
            text-align: center;
            justify-content: center;
            text-decoration: none;
        }

        body.light-mode .btn-back {
            width: 500px;
            padding: 15px 0px;
            border-radius: 10px;
            margin: 20px 0px 10px 0px;
            border: 2px solid black;
            display: flex;
            text-align: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.1);
            color: #1C1C1E;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        body.light-mode .btn-back:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .credentials-info {
            background: rgba(13, 124, 164, 0.1);
            border: 1px solid rgba(13, 124, 164, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
        }

        .credentials-info h3 {
            color: #0D7CA4;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .credentials-info p {
            color: #8E8E93;
            font-size: 12px;
            margin: 4px 0;
            text-align: left;
        }

        
        body.ligth-mode form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        /* From Uiverse.io by Yaya12085 */
        .bt-goo {
            width: 500px;
            display: flex;
            padding: 0.5rem 1.4rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            vertical-align: middle;
            align-items: center;
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 0, 0, 0.25);
            gap: 0.75rem;
            color: rgb(65, 63, 63);
            background-color: #fff;
            cursor: pointer;
            transition: all .6s ease;
            justify-content: center;
        }
        
        .bt-goo svg {
            height: 24px;
        }
        
        .bt-goo:hover {
            transform: scale(1.02);
        }
        
        @media (max-width: 728px){
            .login-container{
                width: 400px;
            }
            form{
                width: 330px;
                margin: 0 auto;
            }

            .btn-login, .bt-goo, .btn-back, body.light-mode input, body.light-mode .btn-back{
                width: 320px;
            }
        }
        
        @media (max-width: 480px) {
            .login-container {
                width: 320px;
            }
            
            .logo img{
                width: 100px;
            }
            
            .credentials-info{
                width: 280px;
                margin: 20px auto;
            }
            
            form{
                width: 320px;
            }
            
            input{
                width: 280px;
            }
            
            .btn-login, .bt-goo, .btn-back, body.light-mode input, body.light-mode .btn-back{
                width: 280px;
            }
            
            .bt-goo{
                justify-content: space-around;
            }
            .login-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
        </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/img/logoDark.jpeg" id="logoImg" alt="Barbearia Silva">
        </div>

        <h1>Acesso ao Sistema</h1>
        <p>Entre com suas credenciais</p>

        <div class="credentials-info">
            <h3>Credenciais para Teste:</h3>
            <p><strong>Admin:</strong> admin@barbearia.com / admin123</p>
            <p><strong>Cliente:</strong> cliente@teste.com / cliente123</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Entrar</button>
            <!-- From Uiverse.io by Yaya12085 -->
            <button class="bt-goo" type="button" id="googleLoginBtn">
                <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid" viewBox="0 0 256 262">
                    <path fill="#4285F4"
                        d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027">
                    </path>
                    <path fill="#34A853"
                        d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1">
                    </path>
                    <path fill="#FBBC05"
                        d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782">
                    </path>
                    <path fill="#EB4335"
                        d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251">
                    </path>
                </svg>
                login com o Google
            </button>
        </form>

        <a href="/" class="btn-back">← Voltar para Home</a>
    </div>

    <script>
        // ===================================
        // FIREBASE CONFIGURATION
        // ===================================
        const firebaseConfig = {
            apiKey: "REMOVED_KEY",
            authDomain: "barbeariahom.firebaseapp.com",
            projectId: "barbeariahom",
            storageBucket: "barbeariahom.firebasestorage.app",
            messagingSenderId: "799723640449",
            appId: "1:799723640449:web:1b99cf357e7fca8c009f80",
            measurementId: "G-EN75CG86CW"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        console.log('[FIREBASE] Firebase inicializado');

        // ===================================
        // THEME MANAGEMENT
        // ===================================
        const logoImg = document.getElementById('logoImg');
        const body = document.body;

        // Load saved theme from localStorage (set by home page)
        const savedTheme = localStorage.getItem('barbearia-theme') || 'dark';
        if (savedTheme === 'light') {
            body.classList.add('light-mode');
            logoImg.src = '/img/logoWhite.jpeg';
        } else {
            body.classList.remove('light-mode');
            logoImg.src = '/img/logoDark.jpeg';
        }

        // Login Logic
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const alert = document.getElementById('alert');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        senha: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Save user data
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);

                    // Show success
                    alert.className = 'alert success';
                    alert.style.display = 'block';
                    alert.textContent = '✓ Login realizado com sucesso!';

                    // Redirect based on user type
                    setTimeout(() => {
                        if (data.user.tipo === 'admin') {
                            window.location.href = '/dashboard';
                        } else {
                            window.location.href = '/';
                        }
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Erro ao fazer login');
                }
            } catch (error) {
                alert.className = 'alert error';
                alert.style.display = 'block';
                alert.textContent = '✗ ' + error.message;

                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';

                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
        });

        // ===================================
        // GOOGLE LOGIN
        // ===================================
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        googleLoginBtn.addEventListener('click', async function() {
            console.log('[GOOGLE LOGIN] ========== INÍCIO DO LOGIN GOOGLE ==========');
            console.log('[GOOGLE LOGIN] Timestamp:', new Date().toISOString());
            console.log('[GOOGLE LOGIN] URL atual:', window.location.href);
            console.log('[GOOGLE LOGIN] Firebase Auth Domain:', firebaseConfig.authDomain);

            // Disable button
            googleLoginBtn.disabled = true;
            googleLoginBtn.innerHTML = '<span>Carregando...</span>';

            try {
                console.log('[GOOGLE LOGIN] Criando provider do Google...');
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('email');
                provider.addScope('profile');
                console.log('[GOOGLE LOGIN] Provider criado com sucesso');

                console.log('[GOOGLE LOGIN] Chamando signInWithPopup...');
                const result = await auth.signInWithPopup(provider);
                console.log('[GOOGLE LOGIN] Popup retornou resultado');

                const user = result.user;
                console.log('[GOOGLE LOGIN] ✓ Login bem-sucedido!');
                console.log('[GOOGLE LOGIN] User ID:', user.uid);
                console.log('[GOOGLE LOGIN] Email:', user.email);
                console.log('[GOOGLE LOGIN] Nome:', user.displayName);

                // Criar objeto de usuário para salvar no localStorage
                const userData = {
                    id: user.uid,
                    nome: user.displayName,
                    email: user.email,
                    foto: user.photoURL,
                    tipo: 'cliente', // Por padrão, usuários do Google são clientes
                    provider: 'google'
                };

                // Salvar no localStorage
                localStorage.setItem('user', JSON.stringify(userData));
                localStorage.setItem('token', user.accessToken || 'google-token');

                // Mostrar sucesso
                alert.className = 'alert success';
                alert.style.display = 'block';
                alert.textContent = '✓ Login com Google realizado com sucesso!';

                // Redirecionar para a home
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);

            } catch (error) {
                console.error('[GOOGLE LOGIN] ========== ERRO NO LOGIN GOOGLE ==========');
                console.error('[GOOGLE LOGIN] Timestamp:', new Date().toISOString());
                console.error('[GOOGLE LOGIN] Código do erro:', error.code);
                console.error('[GOOGLE LOGIN] Mensagem do erro:', error.message);
                console.error('[GOOGLE LOGIN] Stack trace:', error.stack);
                console.error('[GOOGLE LOGIN] Objeto completo do erro:', JSON.stringify(error, null, 2));
                console.error('[GOOGLE LOGIN] Auth Domain configurado:', firebaseConfig.authDomain);
                console.error('[GOOGLE LOGIN] URL da janela:', window.location.href);

                alert.className = 'alert error';
                alert.style.display = 'block';

                // Mensagens de erro mais amigáveis
                let errorMessage = 'Erro ao fazer login com Google';
                let technicalDetails = '';

                if (error.code === 'auth/popup-closed-by-user') {
                    errorMessage = 'Login cancelado pelo usuário';
                } else if (error.code === 'auth/popup-blocked') {
                    errorMessage = 'Pop-up bloqueado. Por favor, permita pop-ups para este site.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage = 'Erro de conexão. Verifique sua internet.';
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorMessage = 'Domínio não autorizado no Firebase. Configure o domínio no Firebase Console.';
                    technicalDetails = `Domínio atual: ${window.location.hostname}`;
                } else {
                    technicalDetails = `Código: ${error.code}`;
                }

                alert.innerHTML = `
                    ✗ ${errorMessage}
                    ${technicalDetails ? `<br><small style="font-size: 11px; opacity: 0.8;">${technicalDetails}</small>` : ''}
                    <br><small style="font-size: 11px; opacity: 0.8;">Verifique o console do navegador (F12) para mais detalhes</small>
                `;

                googleLoginBtn.disabled = false;
                googleLoginBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid" viewBox="0 0 256 262">
                        <path fill="#4285F4"
                            d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027">
                        </path>
                        <path fill="#34A853"
                            d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1">
                        </path>
                        <path fill="#FBBC05"
                            d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782">
                        </path>
                        <path fill="#EB4335"
                            d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251">
                        </path>
                    </svg>
                    login com o Google
                `;

                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
